name: elevatorx_customer
description: Customer mobile app for elevatorX - Elevator Management Platform.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.0.0

  # HTTP & API
  dio: ^5.3.0

  # Local Storage
  shared_preferences: ^2.2.0
  hive: ^2.2.0

  # UI & Icons
  cupertino_icons: ^1.0.0
  flutter_svg: ^2.0.0
  icons_plus: ^4.0.0

  # Date & Time
  intl: ^0.18.0

  # Navigation (Optional - using named routes)
  go_router: ^11.0.0

  # JSON Serialization
  json_annotation: ^4.8.0

  # Notifications (Optional)
  firebase_core: ^2.24.0
  firebase_messaging: ^14.6.0

  # Utilities
  get_it: ^7.6.0
  logger: ^2.0.0
  image_picker: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.7.0
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true
